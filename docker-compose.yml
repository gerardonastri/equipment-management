services:
  # IL TUO GESTIONALE (Next.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipment-db-v18
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:password_sicura@equipment-db-v18:5432/equipment_management
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - db

  # IL DATABASE
  db:
    image: postgres:latest
    container_name: equipment-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password_sicura
      POSTGRES_DB: equipment_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_nuovo:/var/lib/postgresql/data

  # INTERFACCIA DB (Opzionale)
  pgadmin:
    image: dpage/pgadmin4
    container_name: equipment-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:

  postgres_data_nuovo: